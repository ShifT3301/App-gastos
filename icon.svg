<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#0f1a13"/>
      <stop offset="0.6" stop-color="#050806"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="28" y1="16" x2="72" y2="84">
      <stop offset="0" stop-color="#0b5a2a"/>
      <stop offset="0.18" stop-color="#1fb457"/>
      <stop offset="0.34" stop-color="#9dffc2"/>
      <stop offset="0.42" stop-color="#e9fff1"/>
      <stop offset="0.50" stop-color="#3fdc7e"/>
      <stop offset="0.66" stop-color="#0c6e33"/>
      <stop offset="0.80" stop-color="#27b862"/>
      <stop offset="0.90" stop-color="#7cf0a8"/>
      <stop offset="1" stop-color="#0a4a22"/>
    </linearGradient>
    <linearGradient id="ridge" gradientUnits="userSpaceOnUse" x1="30" y1="18" x2="70" y2="82">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <path id="barra" d="M50 17 V83"/>
    <path id="esse" d="M64.5 33 C61 27 55.5 24.5 49.5 24.5 C41 24.5 35.5 29.5 35.5 36 C35.5 43.5 42.5 46 50 48.5 C58 51 64.5 53.5 64.5 62 C64.5 69.5 58 74.5 50 74.5 C43 74.5 37.5 71.5 34.5 65.5"/>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- brilho suave em volta -->
    <g stroke="#1ed760" opacity="0.32" filter="url(#glow)">
      <use href="#barra" stroke-width="7"/><use href="#esse" stroke-width="10"/>
    </g>
    <!-- contorno escuro -->
    <g stroke="#04210f">
      <use href="#barra" stroke-width="7.6"/><use href="#esse" stroke-width="10.1"/>
    </g>
    <!-- corpo metálico -->
    <g stroke="url(#metal)">
      <use href="#barra" stroke-width="6"/><use href="#esse" stroke-width="8.5"/>
    </g>
    <!-- filete de reflexo -->
    <g stroke="url(#ridge)">
      <use href="#barra" stroke-width="1.3"/><use href="#esse" stroke-width="1.8"/>
    </g>
  </g>
</svg>
