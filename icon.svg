<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26292b"/>
      <stop offset="1" stop-color="#141617"/>
    </linearGradient>
    <linearGradient id="branco" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="74">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dedc"/>
    </linearGradient>
    <linearGradient id="verde" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="84">
      <stop offset="0" stop-color="#5ff2b5"/>
      <stop offset="1" stop-color="#1fc98a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <!-- borda interna sutil -->
  <rect x="3" y="3" width="94" height="94" rx="20" fill="none" stroke="#3a3e40" stroke-width="1.2"/>
  <!-- haste do cifrão -->
  <g stroke="url(#verde)" stroke-width="8" stroke-linecap="butt">
    <path d="M50 17 V26"/>
    <path d="M50 74 V83"/>
  </g>
  <!-- S geométrico com cantos chanfrados -->
  <path d="M65 31 H40.5 L34.5 37 V44 L40.5 50 H59.5 L65.5 56 V63 L59.5 69 H35"
        fill="none" stroke="url(#branco)" stroke-width="8.5" stroke-linejoin="miter" stroke-miterlimit="4" stroke-linecap="butt"/>
</svg>
